  <script>
    // Browsers without cross-page View Transitions (e.g. Firefox): if we just came from
    // another page, draw the menu at that page's size from the first frame (see main.js)
    try {
      var s = JSON.parse(sessionStorage.getItem("menuSizeOnLeave"));
      if (s && Date.now() - s.at < 10000 && !("PageRevealEvent" in window) && matchMedia("(min-width: 761px)").matches) {
        document.documentElement.classList.add("menu-entering");
        document.documentElement.style.setProperty("--menu-enter-size", s.size + "px");
      }
    } catch (e) {}
  </script>
